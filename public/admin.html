<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Заявки на курсовые</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f2f3f8; --card:#fff; --ink:#171a28; --muted:#616882;
    --brand:#5b5bd6; --brand-soft:#eef0ff; --line:#e4e6f0;
    --new:#5b5bd6; --inprogress:#d69a2b; --done:#22a06b; --rejected:#d64545;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .topbar { background:var(--card); border-bottom:1px solid var(--line); padding:16px 26px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:20px; font-weight:700; }
  .topbar .count { color:var(--muted); font-weight:500; }
  .logout { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; font-weight:500; }
  .logout:hover { color:var(--err); }
  main { max-width:1000px; margin:0 auto; padding:26px; }

  /* Логин */
  .login-wrap { max-width:360px; margin:12vh auto; background:var(--card); padding:32px; border-radius:16px; box-shadow:0 10px 30px rgba(20,24,42,.08); }
  .login-wrap h2 { font-size:20px; margin-bottom:6px; }
  .login-wrap p { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .login-wrap input { width:100%; padding:13px 14px; border:1.5px solid #dfe2ec; border-radius:11px; font-family:inherit; font-size:15px; margin-bottom:14px; }
  .login-wrap input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .login-wrap button { width:100%; background:var(--brand); color:#fff; border:none; padding:14px; border-radius:11px; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .login-wrap button:hover { opacity:.92; }
  .login-err { color:var(--err); font-size:14px; margin-bottom:12px; display:none; }

  /* Фильтры и список */
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .filters button {
    background:var(--card); border:1.5px solid var(--line); padding:9px 16px; border-radius:100px;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.2s;
  }
  .filters button:hover { border-color:var(--brand); color:var(--brand); }
  .filters button.active { background:var(--brand); border-color:var(--brand); color:#fff; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:14px; box-shadow:0 3px 12px rgba(20,24,42,.04); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .card h3 { font-size:17px; margin-bottom:8px; }
  .meta { color:var(--muted); font-size:13px; display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
  .meta a { color:var(--brand); text-decoration:none; }
  .topic { background:var(--bg); border-left:4px solid var(--brand); padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14.5px; }
  .filelink { font-size:14px; margin-bottom:12px; }
  .filelink a { color:var(--brand); text-decoration:none; font-weight:600; }
  .filelink a:hover { text-decoration:underline; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { padding:6px 12px; border-radius:100px; font-size:12.5px; font-weight:600; }
  .st-new { background:var(--brand-soft); color:var(--brand); }
  .st-inprogress { background:#fdf3e0; color:var(--inprogress); }
  .st-done { background:#e8f8f0; color:var(--done); }
  .st-rejected { background:#fdecec; color:var(--rejected); }
  .status-btn { border:1.5px solid var(--line); background:#fff; padding:7px 13px; border-radius:9px; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .status-btn:hover { border-color:var(--brand); color:var(--brand); }
  .delete { background:none; border:1.5px solid #f0dada; color:var(--err); padding:7px 13px; border-radius:9px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .delete:hover { background:var(--err); color:#fff; border-color:var(--err); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:15px; }
  .hint { color:var(--muted); font-size:13px; margin:20px 0; }
  .hint code { background:#fff; border:1px solid var(--line); padding:2px 7px; border-radius:6px; }

  .hidden { display:none !important; }
  @media(max-width:600px){ main{padding:16px;} .card-top{flex-direction:column;} }
</style>
</head>
<body>

<div class="topbar hidden" id="topbar">
  <div style="display:flex;align-items:baseline;gap:12px;">
    <h1>Заявки на курсовые</h1>
    <span class="count" id="countLabel"></span>
  </div>
  <button class="logout" id="logoutBtn">Выйти</button>
</div>

<!-- Логин -->
<div class="login-wrap" id="loginBox">
  <h2>Вход в админку</h2>
  <p>Пароль задан в файле <code>.env</code></p>
  <div class="login-err" id="loginErr"></div>
  <input type="password" id="passInput" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Войти</button>
</div>

<main id="dashboard" class="hidden">
  <div class="filters" id="filters">
    <button data-f="all" class="active">Все</button>
    <button data-f="new">Новые</button>
    <button data-f="inprogress">В работе</button>
    <button data-f="done">Готовые</button>
    <button data-f="rejected">Отклонённые</button>
    <button id="exportBtn" style="margin-left:auto;background:var(--brand);border-color:var(--brand);color:#fff;" onclick="exportCsv()">⬇ Экспорт в Excel</button>
  </div>
  <div id="list"></div>
</main>

<script>
  const TOKEN_KEY = 'kursach_admin_token';
  let all = [];
  let filter = 'all';

  const STATUS = { new:['Новая','st-new'], inprogress:['В работе','st-inprogress'], done:['Готова','st-done'], rejected:['Отклонена','st-rejected'] };
  const ORDER = ['all','new','inprogress','done','rejected'];

  function getToken(){ return localStorage.getItem(TOKEN_KEY); }

  async function api(path, opts={}){
    const headers = Object.assign({}, opts.headers || {});
    if(getToken()) headers['x-admin-token'] = getToken();
    if(opts.body) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body });
    if(res.status === 401){ localStorage.removeItem(TOKEN_KEY); location.reload(); }
    return res;
  }

  async function doLogin(){
    const err = document.getElementById('loginErr');
    const val = document.getElementById('passInput').value.trim();
    if(!val){ err.textContent='Введите пароль'; err.style.display='block'; return; }
    localStorage.setItem(TOKEN_KEY, val);
    err.style.display='none';
    const r = await api('/api/requests');
    if(r.status===401){ err.textContent='Неверный пароль'; err.style.display='block'; localStorage.removeItem(TOKEN_KEY); return; }
    showDashboard();
  }

  async function load(){
    const r = await api('/api/requests');
    if(r.ok){ all = await r.json(); render(); }
  }

  function render(){
    const filtered = filter==='all' ? all : all.filter(x=>x.status===filter);
    const count = { all:all.length };
    all.forEach(x=>{ count[x.status]=(count[x.status]||0)+1; });
    document.getElementById('countLabel').textContent = '· ' + count.all + ' всего';

    document.querySelectorAll('#filters button').forEach(b=>{
      b.classList.toggle('active', b.dataset.f===filter);
      const n = count[b.dataset.f] || 0;
      b.textContent = ({all:'Все',new:'Новые',inprogress:'В работе',done:'Готовые',rejected:'Отклонённые'})[b.dataset.f] + ` (${n})`;
    });

    const list = document.getElementById('list');
    if(!filtered.length){ list.innerHTML='<div class="empty">Заявок пока нет</div>'; return; }

    list.innerHTML = filtered.map(rq=>{
      const [sn,sc] = STATUS[rq.status]||STATUS.new;
      const d = new Date(rq.createdAt);
      const dateStr = d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
      const deadline = rq.deadline ? `<span>🗓 Срок: ${rq.deadline}</span>` : '';
      return `
      <div class="card">
        <div class="card-top">
          <div>
            <h3>${esc(rq.name)}${rq.workType ? ` <small style="color:#98a;font-size:12px;font-weight:500;">· ${esc(rq.workType)}</small>` : ''}</h3>
            <div class="meta">
              ${rq.phone ? `<span>📞 <a href="tel:${esc(rq.phone)}">${esc(rq.phone)}</a></span>` : ''}
              ${rq.email ? `<span>📧 <a href="mailto:${esc(rq.email)}">${esc(rq.email)}</a></span>` : ''}
              <span>📚 Предмет: ${esc(rq.subject)}</span>
              ${rq.course ? `<span>🎓 Курс/факультет: ${esc(rq.course)}</span>` : ''}
              ${rq.volume ? `<span>📄 Объём: ${esc(rq.volume)} стр.</span>` : ''}
              ${deadline}
              <span>🕒 ${dateStr}</span>
            </div>
          </div>
          <span class="chip ${sc}">${sn}</span>
        </div>
        <div class="topic">${esc(rq.topic)}</div>
        ${rq.fileName ? `<div class="filelink">📎 <a href="/api/files/${encodeURIComponent(rq.fileName)}" target="_blank" rel="noopener">${esc(rq.fileOriginal || 'Скачать файл')}</a></div>` : ''}
        <div class="actions">
          ${ORDER.filter(s=>s!=='all').map(s=>`<button class="status-btn" onclick="setStatus('${rq.id}','${s}')">${STATUS[s][0]}</button>`).join('')}
          <button class="delete" onclick="del('${rq.id}')">Удалить</button>
        </div>
      </div>`;
    }).join('');
  }

  function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function exportCsv(){
    const r = await api('/api/requests/export');
    if(!r.ok) return alert('Не удалось выгрузить');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'zayavki-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function setStatus(id, status){
    const r = await api('/api/requests', { method:'PUT', body: JSON.stringify([{id, status}]) });
    if(r.ok) load();
  }
  async function del(id){
    if(!confirm('Удалить заявку?')) return;
    const r = await api('/api/requests', { method:'DELETE', body: JSON.stringify([id]) });
    if(r.ok) load();
  }

  function showDashboard(){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    load();
  }

  document.getElementById('logoutBtn').onclick = ()=>{ localStorage.removeItem(TOKEN_KEY); location.reload(); };
  document.getElementById('filters').addEventListener('click', e=>{
    if(e.target.tagName==='BUTTON'){ filter=e.target.dataset.f; render(); }
  });

  // Проверка токена при загрузке
  (async function init(){
    if(!getToken()) return;
    const r = await api('/api/requests');
    if(r.ok) showDashboard();
  })();
</script>
</body>
</html>
